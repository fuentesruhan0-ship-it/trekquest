<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#062f22" />
      <stop offset="100%" stop-color="#021a13" />
    </linearGradient>
    <linearGradient id="peakBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="peakFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Morning Sunrise / Compass Star -->
  <circle cx="256" cy="150" r="54" fill="url(#sunGrad)" filter="url(#glow)" opacity="0.9" />

  <!-- Background Mountain Peak -->
  <path d="M120 370 L256 180 L392 370 Z" fill="url(#peakBack)" opacity="0.8" />
  <!-- Snowcap / Summit Glow on Back Peak -->
  <path d="M256 180 L292 230 L268 220 L256 235 L244 220 L220 230 Z" fill="#ecfdf5" opacity="0.9" />

  <!-- Left Foreground Mountain Peak -->
  <path d="M50 420 L180 230 L310 420 Z" fill="url(#peakFront)" />
  <!-- Left Snowcap -->
  <path d="M180 230 L212 280 L195 270 L180 282 L165 270 L148 280 Z" fill="#ffffff" />

  <!-- Right Foreground Mountain Peak -->
  <path d="M220 420 L350 210 L470 420 Z" fill="url(#peakFront)" />
  <!-- Right Snowcap -->
  <path d="M350 210 L385 265 L365 255 L350 270 L335 255 L315 265 Z" fill="#ffffff" />

  <!-- Blue Winding Hiking Trail -->
  <path d="M 120 480 Q 200 440 230 400 T 290 350 T 350 310" 
        fill="none" stroke="url(#trailGrad)" stroke-width="12" stroke-linecap="round" stroke-dasharray="16 12" />

  <!-- Location Pin at Summit -->
  <g transform="translate(350, 195) scale(0.85)">
    <path d="M0 -30 C-14 -30 -25 -19 -25 -5 C-25 15 0 35 0 35 C0 35 25 15 25 -5 C25 -19 14 -30 0 -30 Z" fill="#ef4444" />
    <circle cx="0" cy="-6" r="8" fill="#ffffff" />
  </g>

  <!-- TrekQuest Monogram Label -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="4" fill="#a7f3d0">TREKQUEST</text>
</svg>
